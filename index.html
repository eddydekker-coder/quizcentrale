<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Quizcentrale Blauwe Banaan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22%3E%3Ccircle cx=%2220%22 cy=%2220%22 r=%2219%22 fill=%22%23ffcf3a%22/%3E%3Cpath d=%22M9.5 12.5c1.6 9.8 9.4 16.6 19.6 15 1.8-.3 2.3-1.9 1-2.6-7.1-2.8-12.6-7.7-15-14.6-.6-1.7-5.9-1.6-5.6 2.2z%22 fill=%22%232340d8%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: navy top bar with banana mark, one working column (max 1240px); quiz pages use sub-tabs; programme is a draggable timeline. */
:root{
  --bg:#eef1f8; --surface:#ffffff; --surface-2:#f5f7fc; --ink:#141b3c; --muted:#5a6388; --line:#d8deee; --line-2:#c4cce3;
  --hdr:#121a45; --hdr-ink:#ffffff; --hdr-muted:#aab3dd;
  --blue:#2340d8; --blue-soft:#e3e8ff; --on-blue:#ffffff;
  --banana:#ffcf3a; --banana-soft:#fff3c4; --on-banana:#2b2200;
  --good:#12804f; --good-soft:#dcf3e8; --warn:#9a5c00; --warn-soft:#fdeccd; --bad:#c03636; --bad-soft:#fbe0e0;
  --c0:#2340d8; --c0s:#e3e8ff; --c1:#7438c9; --c1s:#efe5ff; --c2:#0b766e; --c2s:#d6f2ee; --c3:#b8306f; --c3s:#fce0ed; --c4:#8f5d00; --c4s:#ffefc4; --c5:#2d7a1d; --c5s:#e1f3d8;
  --shadow:0 1px 2px rgba(20,27,60,.06),0 6px 20px rgba(20,27,60,.06);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0f2c; --surface:#121a42; --surface-2:#18214f; --ink:#e9ecff; --muted:#9aa3cc; --line:#262f68; --line-2:#323c7c;
  --hdr:#060a22; --hdr-ink:#ffffff; --hdr-muted:#8f98c6;
  --blue:#8299ff; --blue-soft:#1f2a6a; --on-blue:#0a0f2c;
  --banana:#ffd54f; --banana-soft:#3a3214; --on-banana:#241c00;
  --good:#52d49c; --good-soft:#113a2a; --warn:#f2b24e; --warn-soft:#3b2c10; --bad:#ff8080; --bad-soft:#3f1a24;
  --c0:#93a7ff; --c0s:#1f2a6a; --c1:#c3a2ff; --c1s:#2f1f5c; --c2:#5fd6c9; --c2s:#0f3a3a; --c3:#ff8fc0; --c3s:#47183a; --c4:#f5c75a; --c4s:#3d3012; --c5:#8fdc78; --c5s:#1c3a18;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0a0f2c; --surface:#121a42; --surface-2:#18214f; --ink:#e9ecff; --muted:#9aa3cc; --line:#262f68; --line-2:#323c7c;
  --hdr:#060a22; --hdr-ink:#ffffff; --hdr-muted:#8f98c6;
  --blue:#8299ff; --blue-soft:#1f2a6a; --on-blue:#0a0f2c;
  --banana:#ffd54f; --banana-soft:#3a3214; --on-banana:#241c00;
  --good:#52d49c; --good-soft:#113a2a; --warn:#f2b24e; --warn-soft:#3b2c10; --bad:#ff8080; --bad-soft:#3f1a24;
  --c0:#93a7ff; --c0s:#1f2a6a; --c1:#c3a2ff; --c1s:#2f1f5c; --c2:#5fd6c9; --c2s:#0f3a3a; --c3:#ff8fc0; --c3s:#47183a; --c4:#f5c75a; --c4s:#3d3012; --c5:#8fdc78; --c5s:#1c3a18;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
.login{max-width:420px;margin:8vh auto 0;display:flex;flex-direction:column;gap:14px}
.login .brandbig{display:flex;align-items:center;gap:12px}
.login .brandbig svg{width:52px;height:52px}
.userbox{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--hdr-muted)}
.userbox button{background:none;border:1px solid rgba(255,255,255,.25);color:var(--hdr-ink);border-radius:999px;padding:4px 10px;cursor:pointer;font-weight:600;font-size:.78rem}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,3.2vw,2.2rem);font-weight:800}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}

.top{background:var(--hdr);color:var(--hdr-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:inherit;cursor:pointer;background:none;border:0;padding:0}
.brand svg{width:36px;height:36px;flex:none}
.brand span{display:flex;flex-direction:column;line-height:1.05;text-align:left}
.brand b{font-family:var(--f-display);font-size:1.15rem;font-weight:800;letter-spacing:-.01em}
.brand small{color:var(--hdr-muted);font-size:.75rem;font-weight:600}
.logo-disc{fill:var(--banana)} .logo-ban{fill:#2340d8} .logo-tip{fill:#121a45}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{background:none;border:0;color:var(--hdr-muted);padding:8px 12px;border-radius:999px;cursor:pointer;font-weight:600}
.nav button:hover{color:var(--hdr-ink)}
.nav button[aria-current="true"]{background:var(--banana);color:#2b2200}
.sync{margin-left:auto;font-size:.8rem;color:var(--hdr-muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:#52d49c;display:inline-block}
.sync i.busy{background:#ffcf3a} .sync i.off{background:#ff8080}

.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:24px 64px;display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.9rem;white-space:nowrap}
.btn:hover{border-color:var(--blue)}
.btn svg{width:16px;height:16px;flex:none}
.btn-primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-banana{background:var(--banana);border-color:var(--banana);color:var(--on-banana)}
.btn-danger{color:var(--bad)} .btn-danger:hover{border-color:var(--bad)}
.btn-sm{padding:5px 10px;font-size:.82rem}
.btn-icon{padding:6px;border-radius:7px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sel{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card-flat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:.78rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],input[type=tel],input[type=search],select,textarea{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:72px}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-soft)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.fgrid .wide{grid-column:1/-1}
.check{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.9rem;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--blue)}

.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:700;background:var(--surface-2);color:var(--muted);border:1px solid transparent;white-space:nowrap}
.c0{background:var(--c0s);color:var(--c0)} .c1{background:var(--c1s);color:var(--c1)} .c2{background:var(--c2s);color:var(--c2)} .c3{background:var(--c3s);color:var(--c3)} .c4{background:var(--c4s);color:var(--c4)} .c5{background:var(--c5s);color:var(--c5)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-gepland{background:var(--blue-soft);color:var(--blue)} .p-voorbereid{background:var(--good-soft);color:var(--good)} .p-live{background:var(--banana-soft);color:var(--warn)} .p-afgerond{background:var(--surface-2);color:var(--muted)} .p-vervallen{background:var(--bad-soft);color:var(--bad)}
.qcard.vervallen{opacity:.6}.qcard.vervallen h3{text-decoration:line-through}
.status-sel{width:auto;font-weight:700;padding:6px 10px}
.pdfpages{display:flex;flex-direction:column;gap:12px;min-height:200px}.pdfpages canvas,.pdfimg{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
.toggle.vv{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.tag{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:2px 9px;font-size:.78rem;cursor:pointer}
.tag:hover,.tag.sel{border-color:var(--blue);color:var(--blue)}
.tag.sel{background:var(--blue-soft)}
.tag b{font-weight:700;margin-left:3px;font-family:var(--f-mono);font-size:.7rem}

.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r)}
.banner.warn{background:var(--warn-soft)}
.banner.info{background:var(--blue-soft)}
.banner p{flex:1;min-width:220px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font-family:var(--f-display);font-size:1.7rem;font-weight:800;line-height:1.1}
.stat span{font-size:.8rem;color:var(--muted);font-weight:600}
.stat small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}

.qcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.qcard{display:flex;gap:14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;box-shadow:var(--shadow);width:100%}
.qcard:hover{border-color:var(--blue)}
.datebox{flex:none;width:58px;border-radius:8px;background:var(--hdr);color:var(--hdr-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0}
.datebox b{font-family:var(--f-display);font-size:1.6rem;line-height:1}
.datebox span{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:#ffcf3a;font-weight:700}
.qcard-body{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.qcard-body h3{overflow-wrap:anywhere}

.qhead{display:flex;flex-direction:column;gap:10px}
.back{background:none;border:0;color:var(--muted);cursor:pointer;padding:0;font-weight:600;font-size:.85rem;align-self:flex-start}
.back:hover{color:var(--blue)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--banana)}
.tabs button .cnt{font-family:var(--f-mono);font-size:.72rem;background:var(--surface-2);border-radius:999px;padding:1px 7px;margin-left:5px}

/* programma */
.prog{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.prog{grid-template-columns:minmax(0,1fr)}}
.tl-row{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px}
.tl-time{font-family:var(--f-mono);font-weight:700;font-size:.88rem;padding-top:16px;color:var(--muted);text-align:right}
.tl-mini{font-size:.85rem;color:var(--muted);padding:4px 0 12px}
.tl-mini .tl-time{padding-top:0}
.rounds-list{display:flex;flex-direction:column}
.tl-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 14px;margin-bottom:8px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tl-card.cur{border-color:var(--banana);box-shadow:0 0 0 2px var(--banana)}
.round-item.dragging .tl-card{box-shadow:0 14px 40px rgba(10,15,44,.25);border-color:var(--blue);transform:scale(1.01)}
.round-item.dragging{position:relative;z-index:5}
.pause-row{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;margin:-2px 0 8px}
.pause-row span{font-size:.82rem;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:3px 12px;justify-self:start}
.round-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.round-top input{flex:1;min-width:150px;font-weight:700;font-family:var(--f-display);font-size:1.05rem}
.drag-h{cursor:grab;touch-action:none;border:1px dashed var(--line-2);background:var(--surface-2);border-radius:7px;padding:6px 5px;color:var(--muted);display:grid;place-items:center}
.drag-h:active{cursor:grabbing}
.drag-h svg{width:16px;height:16px}
.round-nums{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.round-nums .field{width:104px}
.round-nums .maxp{font-family:var(--f-mono);font-weight:700;padding-bottom:8px}
.qprog{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;flex:1;min-width:80px}
.qprog i{display:block;height:100%;background:var(--blue)}
.sheetpick{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.sheetpick .field{flex:1;min-width:200px}
.addrounds{display:flex;flex-wrap:wrap;gap:6px}
.summary-line{display:flex;gap:18px;flex-wrap:wrap;font-size:.9rem}
.summary-line b{font-family:var(--f-mono)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;font-size:.9rem}
.tbl th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:700;padding:10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;vertical-align:bottom}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.r,.tbl th.r{text-align:right}
.tbl td.c,.tbl th.c{text-align:center}
.tbl input[type=number]{width:70px;padding:6px 8px}
.tbl .tname{font-weight:700}
.tbl .tname.ph{color:var(--muted);font-weight:600;font-style:italic}
.tbl tr.dim td{opacity:.55}
.tbl input.namein{min-width:170px;font-weight:700}
.toggle{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.78rem;font-weight:700;cursor:pointer;color:var(--muted);white-space:nowrap}
.toggle.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}

.score-in{width:64px!important;text-align:right;font-family:var(--f-mono);font-weight:700}
.score-in.over{border-color:var(--bad);background:var(--bad-soft)}
.total{font-family:var(--f-mono);font-weight:700;font-size:1rem}
.rank{font-family:var(--f-display);font-weight:800;font-size:1.05rem}
.mv{font-size:.75rem;font-weight:700;font-family:var(--f-mono)}
.mv.up{color:var(--good)} .mv.down{color:var(--bad)} .mv.eq{color:var(--muted)}
th.curcol,td.curcol{box-shadow:inset 0 3px 0 var(--banana)}
th.curcol{color:var(--ink)}
.medal{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-weight:800;font-family:var(--f-display)}
.m1{background:var(--banana);color:#2b2200} .m2{background:var(--line-2);color:var(--ink)} .m3{background:var(--c4s);color:var(--c4)}
.readout{display:flex;flex-direction:column;gap:8px}
.readout div{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:14px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px}
.readout .pl{font-family:var(--f-display);font-weight:800;font-size:1.5rem;color:var(--blue)}
.readout .nm{font-size:1.35rem;font-weight:700;overflow-wrap:anywhere}
.readout .pt{font-family:var(--f-mono);font-size:1.2rem;font-weight:700}
.readout div.top3{background:var(--banana-soft);border-color:var(--banana)}

.filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:700px){.filters{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.filters .fs{grid-column:1/-1}}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:7px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tagcloud{display:flex;flex-wrap:wrap;gap:6px}
.qlist{display:flex;flex-direction:column;gap:8px}
.qrow{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;align-items:flex-start}
.qrow-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.qrow-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.8rem}
.qp{font-weight:600;overflow-wrap:anywhere}
.qp.big{font-family:var(--f-display);font-size:1.1rem;font-weight:700}
.qa{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.qa span{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-right:6px;color:var(--good)}
.qrow-act{display:flex;gap:4px;flex:none}
.diff{display:inline-flex;gap:2px}
.diff i{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.diff i.f{background:var(--banana)}
.use{color:var(--muted)} .use.warn{color:var(--warn);font-weight:700}
.typestrip{display:flex;gap:8px;flex-wrap:wrap}
.typestrip button{cursor:pointer}
.typestrip button.sel{border-color:currentColor}

.script-round{display:flex;flex-direction:column;gap:10px}
.script-round ol{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:q}
.script-round li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;counter-increment:q}
.script-round li::before{content:counter(q);font-family:var(--f-display);font-weight:800;font-size:1.3rem;color:var(--blue)}
.script-round li.empty{border-style:dashed;color:var(--muted);background:transparent}
.listedit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px}
.listans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;margin:0;padding:0;list-style:none}

.item-row b{font-family:var(--f-mono);color:var(--muted);text-align:right;font-size:.85rem}
.item-head{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
@media (max-width:560px){.item-row{grid-template-columns:22px minmax(0,1fr) 34px}.item-row .ip{grid-column:2}.item-row .ia{grid-column:2}.item-row .btn{grid-row:1/span 2;grid-column:3}.item-row b{grid-row:1/span 2}.item-head{display:none}}

<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script>
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const num=v=>(v===''||v==null||isNaN(+v))?null:+v;
const fmt=n=>n==null?'–':String(Math.round(n*100)/100).replace('.',',');
const money=n=>'€ '+(Math.round((n||0)*100)/100).toFixed(2).replace('.',',');
function fmtDate(d,o){ if(!d) return 'Datum nog onbekend'; const dt=new Date(d+'T12:00:00'); if(isNaN(dt)) return d; return dt.toLocaleDateString('nl-NL',o||{weekday:'short',day:'numeric',month:'short',year:'numeric'}); }
function addMin(hhmm,min){ const [h,m]=(hhmm||'20:00').split(':').map(Number); const t=(h||0)*60+(m||0)+min; return String(Math.floor(t/60)%24).padStart(2,'0')+':'+String(((t%60)+60)%60).padStart(2,'0'); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function splitTags(s){ return [...new Set(String(s||'').split(/[,;#]/).map(t=>t.trim().toLowerCase()).filter(Boolean))]; }

const LOGO=`<svg viewBox="0 0 40 40" aria-hidden="true"><circle class="logo-disc" cx="20" cy="20" r="19"/><path class="logo-ban" d="M9.5 12.5c1.6 9.8 9.4 16.6 19.6 15 1.8-.3 2.3-1.9 1-2.6-7.1-2.8-12.6-7.7-15-14.6-.6-1.7-5.9-1.6-5.6 2.2z"/><path class="logo-tip" d="M9.4 12.4c-.3-1.6.4-2.6 1.6-2.9l.6 2.3z"/></svg>`;
const I={
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  del:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  grip:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
  dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
  up2:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V5M7 10l5-5 5 5M5 20h14"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
};

/* format: 'los' = losse vragen uit de bank; 'blad' = een vragenblad met naam (bijv. Hoofdsteden) */
const DEFAULT_TYPES=[
  {id:'grabbelton',name:'Grabbelton',format:'los',desc:'10 willekeurige kennisvragen',q:10,pts:1,dur:15,medium:'Microfoon',promptLabel:'Vraag',answerLabel:'Antwoord',color:0},
  {id:'ai',name:'AI-ronde',format:'blad',desc:'10 AI-gegenereerde plaatjes die cryptisch iets uitbeelden',q:10,pts:1,dur:15,medium:'Vragenblad',promptLabel:'Plaatje (omschrijving)',answerLabel:'Oplossing',color:1},
  {id:'missinglink',name:'The Missing Link',format:'blad',desc:'10 × 4 woorden die iets met elkaar te maken hebben',q:10,pts:1,dur:15,medium:'Vragenblad',promptLabel:'De 4 woorden',answerLabel:'De link',color:2},
  {id:'lijstjes',name:'Lijstjesronde',format:'lijst',desc:'1 vraag met 10 antwoorden, de volgorde maakt niet uit',q:10,pts:1,dur:15,medium:'Microfoon',promptLabel:'Vraag',answerLabel:'Antwoord',color:5},
  {id:'muziek',name:'Muziekronde',format:'blad',desc:'10 nummers: artiest of titel goed is 0,5 punt, allebei goed is 1 punt',q:10,pts:1,dur:20,medium:'Speaker',promptLabel:'Fragment (track of tijdstip)',answerLabel:'Artiest – titel',color:3},
  {id:'foto',name:'Fotoronde',format:'blad',desc:'10 plaatjes van iets: raad wat het is',q:10,pts:1,dur:15,medium:'Vragenblad',promptLabel:'Foto (omschrijving)',answerLabel:'Antwoord',color:4},
];
const FORMAT_FALLBACK={grabbelton:'los'};
const STATUSES=[['gepland','Gepland'],['voorbereid','Voorbereid'],['live','Live'],['afgerond','Afgerond'],['vervallen','Vervallen']];
const statusLabel=s=>(STATUSES.find(x=>x[0]===s)||STATUSES[0])[1];
const DEFAULT_MSG='Hoi {contact}! Leuk dat je met je team meedoet aan {quiz} op {datum}. We beginnen om {tijd} bij {locatie}. Jullie zijn met {spelers} personen; de kosten zijn {prijs} p.p. ({totaal} in totaal). Bedenk alvast een mooie teamnaam. Tot dan!';

/* ---------- state ---------- */
const S={mode:'loading',readOnly:false,quizzes:{},questions:{},sheets:{},venues:{},types:null,ready:false};
const ui={qt:{captain:'',players:'',phone:'',email:''},view:'home',quizId:null,tab:'programma',bank:{kind:'blad',q:'',type:'',tag:'',diff:'',usage:'',limit:80},standAfter:null,readOrder:false,hideAnswers:false,modal:null};
const SB_URL='https://hdzciyhnysdjafrrnfuu.supabase.co';
const SB_KEY='sb_publishable_-XhHCIi-BQWIfCUOzJvK4A_MFLkdy4l';
const BUCKET='bladen';
let sb=null,session=null,rtChannel=null;
const ui_login={email:'',sent:false,busy:false,err:''};
const PDFJS_BASE='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/';
function loadScript(src){ return new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src=src; sc.onload=res; sc.onerror=rej; document.head.appendChild(sc); }); }
let pdfjsP=null;
function loadPdfJs(){ if(!pdfjsP) pdfjsP=(async()=>{ if(!window.pdfjsLib) await loadScript(PDFJS_BASE+'pdf.min.js'); if(!window.pdfjsWorker) await loadScript(PDFJS_BASE+'pdf.worker.min.js'); const lib=window.pdfjsLib; if(!lib) throw new Error('pdfjs'); lib.GlobalWorkerOptions.workerSrc=PDFJS_BASE+'pdf.worker.min.js'; return lib; })().catch(e=>{ pdfjsP=null; throw e; }); return pdfjsP; }
async function fileUrl(f){ if(!f||!f.path||!sb) return ''; const {data,error}=await sb.storage.from(BUCKET).createSignedUrl(f.path,3600); if(error) throw error; return data.signedUrl; }
function fmtSize(b){ b=num(b)||0; return b>1048576?(b/1048576).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(b/1024))+' kB'; }
const LS_KEY='bbq-quizcentrale-v1';
const dirty={},ver={},timers={},inflight={};

function types(){ return S.types||DEFAULT_TYPES; }
function typeOf(id){ return types().find(t=>t.id===id)||{id,name:id||'Onbekend',color:5,promptLabel:'Vraag',answerLabel:'Antwoord',desc:'',medium:'',format:'los'}; }
function formatOf(id){ const t=types().find(x=>x.id===id); if(t&&t.format) return t.format; const d=DEFAULT_TYPES.find(x=>x.id===id); if(d) return d.format; if(t&&/lijst/i.test(t.name||'')) return 'lijst'; return FORMAT_FALLBACK[id]||'los'; }
function isSheet(id){ const f=formatOf(id); return f==='blad'||f==='lijst'; }
function isList(id){ return formatOf(id)==='lijst'; }
function typeChip(id){ const t=typeOf(id); return `<span class="chip c${(t.color??5)%6}">${esc(t.name)}</span>`; }
function teamName(t){ return (t&&t.name&&String(t.name).trim())||(t&&t.captain?'Team van '+t.captain:'Naamloos team'); }

/* ---------- storage ---------- */
function lsLoad(){ try{ const raw=localStorage.getItem(LS_KEY); return raw?JSON.parse(raw):null; }catch(e){ return null; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY,JSON.stringify({quizzes:S.quizzes,questions:S.questions,sheets:S.sheets,venues:S.venues,types:S.types})); }catch(e){ toast('Opslaan op dit apparaat lukt niet: de browseropslag is geblokkeerd.','bad'); } }
function useLocal(){
  S.mode='local'; S.readOnly=false;
  const d=lsLoad();
  if(d){ S.quizzes=d.quizzes||{}; S.questions=d.questions||{}; S.sheets=d.sheets||{}; S.venues=d.venues||{}; S.types=d.types||null; }
  if(!S.types) S.types=clone(DEFAULT_TYPES);
  S.ready=true; render();
}
window.addEventListener('storage',e=>{
  if(S.mode!=='local'||e.key!==LS_KEY) return;
  const d=lsLoad(); if(!d) return;
  for(const col of ['quizzes','questions','sheets','venues']){ const nq=d[col]||{};
    for(const id of Object.keys(S[col])) if(!nq[id]&&!dirty[col+'/'+id]) delete S[col][id];
    for(const [id,q] of Object.entries(nq)) if(!dirty[col+'/'+id]) S[col][id]=q; }
  if(d.types) S.types=d.types; softRender();
});
let pendingRender=false;
function editingInApp(){ const a=document.activeElement; return !!(a&&a!==document.body&&$('#app').contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)); }
function softRender(){ if(S.ready&&editingInApp()){ pendingRender=true; return; } pendingRender=false; render(); }
document.addEventListener('focusout',()=>{ setTimeout(()=>{ if(pendingRender&&!editingInApp()){ pendingRender=false; renderSafe(); } },0); });
function applyChanges(snap,col,map){
  for(const ch of snap.docChanges()){
    const id=ch.doc.id; if(dirty[col+'/'+id]) continue;
    if(ch.type==='removed') delete map[id];
    else { const d=ch.doc.data(); if(d) map[id]=Object.assign(clone(d),{id}); }
  }
}
async function boot(){
  render();
  if(!window.supabase||!window.supabase.createClient){ useLocal(); toast('De verbinding met de database kon niet worden geladen. Je werkt nu alleen op dit apparaat.','bad'); return; }
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'implicit'}});
  const {data}=await sb.auth.getSession(); session=data.session;
  sb.auth.onAuthStateChange((ev,sess)=>{ const had=!!session; session=sess;
    if(sess&&!had){ startData(); }
    if(!sess&&had){ location.reload(); } });
  if(!session){ S.mode='login'; render(); return; }
  startData();
}
let dataStarted=false;
async function startData(){
  if(dataStarted) return; dataStarted=true;
  S.mode='cloud'; render();
  try{
    const rows=[]; let from=0;
    for(;;){ const {data,error}=await sb.from('docs').select('col,id,data').order('col').order('id').range(from,from+999); if(error) throw error; rows.push(...data); if(data.length<1000) break; from+=1000; }
    S.quizzes={}; S.questions={}; S.sheets={}; S.venues={}; S.types=null;
    for(const r of rows) applyRow(r);
    if(!S.types) S.types=clone(DEFAULT_TYPES);
    S.ready=true; render();
  }catch(e){ console.error(e); S.ready=true; S.loadError=true; render(); toast('Gegevens laden mislukt. Herlaad de pagina.','bad'); return; }
  rtChannel=sb.channel('docs-wijzigingen').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
    if(p.eventType==='DELETE'){ const o=p.old||{}; if(!o.col||dirty[o.col+'/'+o.id]) return; if(S[o.col]&&o.col!=='settings') delete S[o.col][o.id]; softRender(); return; }
    const r=p.new; if(!r||dirty[r.col+'/'+r.id]) return; applyRow(r); softRender();
  }).subscribe();
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&S.mode==='cloud') refreshAll(); });
}
function applyRow(r){
  if(r.col==='settings'){ if(r.id==='types'&&!dirty['settings/types']){ const d=r.data; S.types=d&&Array.isArray(d.list)&&d.list.length?clone(d.list):clone(DEFAULT_TYPES); } return; }
  if(!['quizzes','questions','sheets','venues'].includes(r.col)) return;
  S[r.col][r.id]=Object.assign(clone(r.data||{}),{id:r.id});
}
let refreshBusy=false;
async function refreshAll(){
  if(refreshBusy||!sb) return; refreshBusy=true;
  try{ const rows=[]; let from=0; for(;;){ const {data,error}=await sb.from('docs').select('col,id,data').range(from,from+999); if(error) throw error; rows.push(...data); if(data.length<1000) break; from+=1000; }
    const seen={}; for(const r of rows){ seen[r.col+'/'+r.id]=1; if(!dirty[r.col+'/'+r.id]) applyRow(r); }
    for(const col of ['quizzes','questions','sheets','venues']) for(const id of Object.keys(S[col])) if(!seen[col+'/'+id]&&!dirty[col+'/'+id]) delete S[col][id];
    softRender(); }catch(e){} refreshBusy=false;
}
function onDbErr(){ toast('Verbinding met de database weggevallen. Herlaad de pagina.','bad'); }
function persist(path,delay=450){
  if(S.readOnly){ toast('Je hebt alleen leesrechten. Maak een kopie op dit apparaat om zelf te beheren.','bad'); return false; }
  dirty[path]=true; ver[path]=(ver[path]||0)+1;
  clearTimeout(timers[path]); timers[path]=setTimeout(()=>flush(path),delay);
  setSync(); return true;
}
function bodyFor(path){
  const [col,id]=path.split('/');
  if(col==='quizzes'||col==='questions'||col==='sheets'||col==='venues'){ const x=S[col][id]; if(!x) return null; const b=clone(x); delete b.id; return b; }
  if(path==='settings/types') return {list:clone(types())};
  return null;
}
async function flush(path,retry){
  if(inflight[path]){ clearTimeout(timers[path]); timers[path]=setTimeout(()=>flush(path),200); return; }
  const v=ver[path]; inflight[path]=true;
  try{
    if(S.mode==='cloud'){ const [col,id]=path.split('/'); const b=bodyFor(path);
      const res=b==null?await sb.from('docs').delete().eq('col',col).eq('id',id):await sb.from('docs').upsert({col,id,data:b,updated_at:new Date().toISOString()});
      if(res.error) throw Object.assign(new Error(res.error.message),{code:res.error.code||'db'}); }
    else lsSave();
  }catch(e){
    inflight[path]=false;
    const code=e&&e.code;
    console.error(e);
    if(!retry){ setTimeout(()=>flush(path,true),800+Math.random()*800); return; }
    if(code==='42501'||code==='PGRST301') toast('Je bent uitgelogd of hebt geen rechten. Log opnieuw in.','bad');
    else toast('Opslaan mislukt. Controleer je internetverbinding; de app probeert het bij de volgende wijziging opnieuw.','bad');
  }
  inflight[path]=false;
  if(ver[path]===v) dirty[path]=false;
  setSync();
}
function setSync(){ const el=$('#sync'); if(el) el.innerHTML=syncLabel(); }
function syncLabel(){
  if(S.mode==='loading') return '<i class="busy"></i>Laden…';
  const busy=Object.values(dirty).some(Boolean);
  if(S.mode==='login') return '';
  if(S.mode==='local') return `<i class="${busy?'busy':''}"></i>${busy?'Opslaan…':'Op dit apparaat'}`;
  return `<i class="${busy?'busy':''}"></i>${busy?'Opslaan…':'Opgeslagen'}`;
}
function saveQuiz(q,delay){ return persist('quizzes/'+q.id,delay); }
async function writeMany(paths){
  for(const p of paths){ dirty[p]=true; ver[p]=(ver[p]||0)+1; } setSync();
  if(S.mode!=='cloud'){ for(const p of paths){ await flush(p); } return; }
  const rows=paths.map(p=>{ const [col,id]=p.split('/'); return {col,id,data:bodyFor(p),updated_at:new Date().toISOString()}; }).filter(r=>r.data!=null);
  try{ for(let i=0;i<rows.length;i+=100){ const {error}=await sb.from('docs').upsert(rows.slice(i,i+100)); if(error) throw error; } }
  catch(e){ console.error(e); toast('Opslaan van een deel van de gegevens mislukt. Probeer het opnieuw.','bad'); }
  for(const p of paths) dirty[p]=false; setSync();
}

/* ---------- derived ---------- */
function curQuiz(){ return S.quizzes[ui.quizId]; }
function activeTeams(q){ return (q.teams||[]).filter(t=>t.status!=='wachtlijst'&&t.status!=='afgemeld'); }
function teamOrder(a,b){ const x=num(a.table),y=num(b.table); if(x!=null&&y!=null&&x!==y) return x-y; if(x!=null&&y==null) return -1; if(y!=null&&x==null) return 1; return teamName(a).localeCompare(teamName(b),'nl'); }
function roundMax(r){ return (num(r.qCount)||0)*(num(r.pts)||0); }
function rawScore(q,t,r){ return num(q.scores?.[t.id]?.[r.id]); }
function standings(q,upto){
  const rs=(q.rounds||[]).slice(0,upto+1);
  const soA=num(q.tiebreak?.answer); const isFinal=upto===(q.rounds||[]).length-1;
  const rows=activeTeams(q).map(t=>{ let total=0; const per=rs.map(r=>{ const p=rawScore(q,t,r); if(p!=null) total+=p; return p; });
    const d=(soA!=null&&num(t.tiebreak)!=null)?Math.abs(num(t.tiebreak)-soA):null; return {t,per,total,d}; });
  const cmp=(a,b)=>(b.total-a.total)||((isFinal&&soA!=null)?((a.d??1e15)-(b.d??1e15)):0);
  rows.sort((a,b)=>cmp(a,b)||teamName(a.t).localeCompare(teamName(b.t),'nl'));
  rows.forEach((row,i)=>{ row.rank=(i>0&&cmp(rows[i-1],row)===0)?rows[i-1].rank:i+1;
    row.soUsed=isFinal&&soA!=null&&((i>0&&rows[i-1].total===row.total)||(i<rows.length-1&&rows[i+1].total===row.total)); });
  return rows;
}
function lastScoredIdx(q){ let k=-1; const ts=activeTeams(q); (q.rounds||[]).forEach((r,i)=>{ if(ts.some(t=>rawScore(q,t,r)!=null)) k=i; }); return k; }
function usage(){ const qm={},sm={}; for(const q of Object.values(S.quizzes)) for(const r of (q.rounds||[])){
    if(isSheet(r.typeId)){ if(r.sheetId) (sm[r.sheetId]=sm[r.sheetId]||[]).push({quizId:q.id,name:q.name,date:q.date,roundId:r.id}); }
    else for(const id of (r.questionIds||[])) (qm[id]=qm[id]||[]).push({quizId:q.id,name:q.name,date:q.date,roundId:r.id}); }
  return {q:qm,s:sm}; }
function schedule(q){ let t=num(q.introMin)||0; const out=[]; for(const r of (q.rounds||[])){ const st=t; t+=(num(r.dur)||0); const pauseAt=t; t+=(num(r.breakAfter)||0); out.push({start:addMin(q.start,st),pause:addMin(q.start,pauseAt)}); } return {rounds:out,end:addMin(q.start,t)}; }
function sheetItems(sh){ return (sh&&sh.items||[]).filter(it=>String(it.a||'').trim()||String(it.p||'').trim()); }
function roundFilled(r){ if(isSheet(r.typeId)){ const sh=S.sheets[r.sheetId]; return sh?sheetItems(sh).length:0; } return (r.questionIds||[]).length; }

function captureFocus(){ const a=document.activeElement; if(a&&a.id&&a!==document.body&&$('#app').contains(a)){ let s=null,e=null; try{ s=a.selectionStart; e=a.selectionEnd; }catch(x){} return {id:a.id,s,e}; } return null; }

function tabTeams(q){

  <tbody>${body}</tbody><tfoot><tr><td></td><td class="small muted">Ingevuld</td>${foot}<td></td><td></td></tr></tfoot></table></div>`;

function tabStand(q){
  const rs=q.rounds||[]; const last=lastScoredIdx(q);
  if(last<0) return '<p class="muted">Nog geen scores ingevuld. Zodra de eerste ronde is nagekeken, verschijnt hier de stand.</p>';
  const after=ui.standAfter!=null&&ui.standAfter<rs.length?ui.standAfter:last;
  const st=standings(q,after); const prev=after>0?standings(q,after-1):null; const pr={}; if(prev) prev.forEach(r=>pr[r.t.id]=r.rank);
  const lead=st[0]?.total||0; const isFinal=after===rs.length-1;
  const controls=`<div class="spread"><label class="field" style="min-width:220px"><span>Stand na</span><select id="stand-after" data-ui="standAfter">${rs.map((r,i)=>`<option value="${i}" ${i===after?'selected':''}>Ronde ${i+1}: ${esc(r.title)}${i===rs.length-1?' (eindstand)':''}</option>`).join('')}</select></label>
    <div class="row"><div class="seg" role="group" aria-label="Weergave"><button aria-pressed="${!ui.readOrder}" data-a="readOrder" data-v="0">Tabel</button><button aria-pressed="${ui.readOrder}" data-a="readOrder" data-v="1">Voorlezen</button></div></div></div>`;
  if(ui.readOrder){
    const rev=st.slice().reverse();
    return `${controls}<p class="muted">Voorleesvolgorde: van de laatste naar de eerste plaats.</p><div class="readout">${rev.map(r=>`<div class="${r.rank<=3?'top3':''}"><span class="pl">${r.rank}e</span><span class="nm">${esc(teamName(r.t))}${r.soUsed?' <span class="chip c4">shoot-out</span>':''}</span><span class="pt">${fmt(r.total)}</span></div>`).join('')}</div>`;
  }
  const rows=st.map(r=>{ const d=prev?pr[r.t.id]-r.rank:0; const mv=!prev?'':d>0?`<span class="mv up">▲${d}</span>`:d<0?`<span class="mv down">▼${-d}</span>`:'<span class="mv eq">=</span>';
    return `<tr><td class="c">${r.rank<=3?`<span class="medal m${r.rank}">${r.rank}</span>`:`<span class="rank">${r.rank}</span>`}</td><td>${mv}</td><td><span class="tname ${r.t.name?'':'ph'}">${esc(teamName(r.t))}</span>${r.soUsed?` <span class="chip c4">shoot-out: ${esc(r.t.tiebreak??'–')}</span>`:''}</td>
      ${r.per.map(p=>`<td class="r num">${fmt(p)}</td>`).join('')}
      <td class="r total">${fmt(r.total)}</td><td class="r small muted num">${r.total===lead?'':'−'+fmt(lead-r.total)}</td></tr>`; }).join('');
  return `${controls}
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th class="c">#</th><th></th><th>Team</th>${rs.slice(0,after+1).map((r,i)=>`<th class="r">R${i+1}</th>`).join('')}<th class="r">Totaal</th><th class="r">Achterstand</th></tr></thead><tbody>${rows}</tbody></table></div>
  ${isFinal&&q.tiebreak?.question?`<p class="small muted">Shoot-out: ${esc(q.tiebreak.question)} Juiste antwoord: <b class="num">${esc(q.tiebreak.answer??'nog niet ingevuld')}</b></p>`:''}`;
}

/* ----- locaties ----- */
const WD=['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
const NTH={'1':'1e','2':'2e','3':'3e','4':'4e','-1':'laatste'};
const MON=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
function isoD(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function blankVenue(){ return {name:'',street:'',postcode:'',city:'',contactName:'',contactPhone:'',contactEmail:'',notes:'',recurring:{enabled:false,pattern:'monthly',nth:'3',weekday:'4',start:'20:00',host:'',price:7,maxTeams:20,skipMonths:[]}}; }
function recurText(v){ const r=v&&v.recurring; if(!r||!r.enabled) return 'Geen vaste quizavond';
  let t=r.pattern==='weekly'?`Iedere ${WD[+r.weekday]}`:`Iedere ${NTH[String(r.nth)]||r.nth} ${WD[+r.weekday]} van de maand`;
  if(r.start) t+=` om ${r.start}`; const sk=(r.skipMonths||[]).slice().sort((a,b)=>a-b); if(sk.length) t+=` (niet in ${sk.map(m=>MON[m]).join(', ')})`; return t; }
function nextOccurrences(v,fromISO,months){
  const r=v&&v.recurring; if(!r||!r.enabled) return []; const out=[]; const wd=+r.weekday; const skip=r.skipMonths||[];
  const from=new Date(fromISO+'T00:00:00'); const end=new Date(from); end.setMonth(end.getMonth()+months);
  if(r.pattern==='weekly'){ const d=new Date(from); while(d.getDay()!==wd) d.setDate(d.getDate()+1); for(;d<=end;d.setDate(d.getDate()+7)) if(!skip.includes(d.getMonth())) out.push(isoD(d)); return out; }
  const nth=+r.nth;
  for(let k=0;k<=months;k++){ const base=new Date(from.getFullYear(),from.getMonth()+k,1); const dim=new Date(base.getFullYear(),base.getMonth()+1,0).getDate(); let day;
    if(nth>0){ day=1+((wd-base.getDay()+7)%7)+(nth-1)*7; if(day>dim) continue; } else { const lastDow=new Date(base.getFullYear(),base.getMonth(),dim).getDay(); day=dim-((lastDow-wd+7)%7); }
    const d=new Date(base.getFullYear(),base.getMonth(),day); if(d>=from&&d<=end&&!skip.includes(d.getMonth())) out.push(isoD(d)); }
  return out;
}
function quizAt(v,date){ return Object.values(S.quizzes).find(q=>q.venueId===v.id&&q.date===date); }
function unplanned(v,months){ return nextOccurrences(v,todayISO(),months).filter(d=>!quizAt(v,d)); }
function venueLabel(q){ const v=S.venues[q.venueId]; return v?v.name+(v.city?', '+v.city:''):(q.venue||''); }
function venueField(q){ const vs=Object.values(S.venues).sort((a,b)=>(a.name||'').localeCompare(b.name||'','nl'));
  return `<label class="field"><span>Locatie</span><select id="qf-venue" data-q="venueId"><option value="">${q.venue&&!q.venueId?esc(q.venue)+' (niet in locaties)':'— kies een locatie —'}</option>${vs.map(v=>`<option value="${v.id}" ${q.venueId===v.id?'selected':''}>${esc(v.name)}${v.city?' ('+esc(v.city)+')':''}</option>`).join('')}</select></label>`; }
function homeUnplanned(){
  const rows=[]; Object.values(S.venues).forEach(v=>unplanned(v,2).forEach(d=>rows.push({v,d}))); rows.sort((a,b)=>a.d.localeCompare(b.d));

}

        ${unplanned(v,3).length>1?`<button class="btn btn-sm" data-a="planAll" data-venue="${v.id}" style="align-self:flex-start">Alle avonden komende 3 maanden inplannen</button>`:''}</div>`:''}

}

/* ----- bank ----- */
function matchCommon(x,b,used){
  if(b.type&&x.typeId!==b.type) return false;
  if(b.tag&&!(x.tags||[]).includes(b.tag)) return false;
  if(b.diff&&String(x.diff)!==b.diff) return false;
  if(b.usage==='unused'&&used) return false;
  if(b.usage==='used'&&!used) return false;
  return true;
}
function bankFiltered(){
  const b=ui.bank; const U=usage(); const qs=b.q.trim().toLowerCase();
  const sh=Object.values(S.sheets).filter(x=>matchCommon(x,b,U.s[x.id])&&(!qs||((x.name||'')+' '+(x.question||'')+' '+(x.tags||[]).join(' ')+' '+(x.items||[]).map(i=>(i.p||'')+' '+(i.a||'')).join(' ')).toLowerCase().includes(qs))).map(x=>({k:'s',x}));
  const qq=Object.values(S.questions).filter(x=>matchCommon(x,b,U.q[x.id])&&(!qs||((x.prompt||'')+' '+(x.answer||'')+' '+(x.fact||'')+' '+(x.tags||[]).join(' ')+' '+(x.notes||'')+' '+(x.media||'')).toLowerCase().includes(qs))).map(x=>({k:'q',x}));
  return sh.concat(qq).sort((a,c)=>(c.x.createdAt||0)-(a.x.createdAt||0));
}

function usageText(u,label){ if(!u||!u.length) return `<span class="use">${label||'Nog niet gebruikt'}</span>`; const l=u.map(x=>esc(x.name)+(x.date?' ('+esc(fmtDate(x.date,{day:'numeric',month:'short'}))+')':'')); return `<span class="use warn">Gebruikt: ${l.join(', ')}</span>`; }

      return `<article class="qrow"><div class="qrow-main"><div class="qrow-top">${typeChip(x.typeId)}${diffDots(x.diff)}<span class="chip">${its.length} ${isList(x.typeId)?(its.length===1?'antwoord':'antwoorden'):(its.length===1?'vraag':'vragen')}</span>${x.pdf?`<button class="chip c4" style="cursor:pointer;border:0" data-a="viewSheetPdf" data-id="${x.id}">${/pdf/.test(x.pdf.type||'')?'PDF':'Afbeelding'} tonen</button>`:''}${usageText(U.s[x.id],'Nog niet gespeeld')}</div>
        ${isList(x.typeId)?`<p class="qp big">${esc(x.question||x.name)}</p>`:`<p class="qp big">${esc(x.name)}</p>${x.question?`<p class="qa">${esc(x.question)}</p>`:''}`}
        <p class="qa"><span>Antwoorden</span>${esc(its.slice(0,5).map(i=>i.a).join(' · '))}${its.length>5?' …':''}</p>
        ${(x.tags||[]).length?`<div class="row" style="gap:6px">${x.tags.map(t=>`<button class="tag" data-a="bankTag" data-v="${esc(t)}">#${esc(t)}</button>`).join('')}</div>`:''}

async function uploadSheetFile(file){
  const m=ui.modal; if(!file||!m||m.kind!=='sheet'||S.mode!=='cloud') return;
  const type=file.type||(/\.pdf$/i.test(file.name)?'application/pdf':/\.png$/i.test(file.name)?'image/png':/\.jpe?g$/i.test(file.name)?'image/jpeg':'');
  if(!/^(application\/pdf|image\/(png|jpeg|webp))$/.test(type)){ toast('Kies een PDF, JPG, PNG of WebP-bestand','bad'); return; }
  if(file.size>20*1024*1024){ toast('Dit bestand is groter dan 20 MB. Verklein de PDF en probeer het opnieuw.','bad'); return; }
  m.uploading=true; renderModal();
  try{ const ext=(file.name.match(/\.([a-z0-9]+)$/i)||[,''])[1].toLowerCase(); const path=new Date().getFullYear()+'/'+uid()+(ext?'.'+ext:'');
    const {error}=await sb.storage.from(BUCKET).upload(path,file,{contentType:type,upsert:false}); if(error) throw error;
    (m.newUploads=m.newUploads||[]).push(path); m.draft.pdf={path,name:file.name,size:file.size,type}; toast('Bestand geüpload. Vergeet niet op Opslaan te drukken.'); }
  catch(e){ console.error(e); const msg=String(e&&e.message||''); toast(/size|large/i.test(msg)?'Bestand te groot (max 20 MB)':/mime|type/i.test(msg)?'Dit bestandstype wordt niet ondersteund':'Uploaden mislukt. Probeer het opnieuw.','bad'); }
  m.uploading=false; if(ui.modal===m) renderModal();
}

async function renderPdf(m){
  const box=$('#pdf-pages'); if(!box||box.dataset.done) return; box.dataset.done='1';
  try{ const lib=await loadPdfJs(); const res=await fetch(m.url); if(!res.ok) throw new Error('missing'); const buf=await res.arrayBuffer();
    const doc=await lib.getDocument({data:buf}).promise; if(ui.modal!==m) return; box.innerHTML='';
    const w=box.clientWidth||800; const dpr=Math.min(2,window.devicePixelRatio||1);
    for(let i=1;i<=doc.numPages;i++){ const page=await doc.getPage(i); if(ui.modal!==m) return; const v1=page.getViewport({scale:1}); const vp=page.getViewport({scale:(w/v1.width)*dpr});
      const cv=document.createElement('canvas'); cv.width=Math.floor(vp.width); cv.height=Math.floor(vp.height); cv.setAttribute('role','img'); cv.setAttribute('aria-label','Pagina '+i); box.appendChild(cv);
      await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise; }
  }catch(e){ if(ui.modal===m) box.innerHTML='<p class="muted">Het blad kan hier niet worden getoond. Gebruik “Openen in nieuw tabblad”.</p>'; }

function parseDelimited(text){
  const lines=text.replace(/\r/g,'').split('\n').filter(l=>l.trim());
  return lines.map(l=>{ const sep=l.includes('\t')?'\t':l.includes(';')?';':','; const out=[]; let cur='',inq=false;
    for(let i=0;i<l.length;i++){ const c=l[i]; if(inq){ if(c==='"'&&l[i+1]==='"'){cur+='"';i++;} else if(c==='"') inq=false; else cur+=c; } else if(c==='"') inq=true; else if(c===sep){ out.push(cur.trim()); cur=''; } else cur+=c; }
    out.push(cur.trim()); return out; });
}

/* ---------- drag & drop rounds (pointer events: mouse + touch) ---------- */
let drag=null;
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest('.drag-h'); if(!h||S.readOnly) return;
  const item=h.closest('.round-item'); const list=$('#rounds-list'); if(!item||!list) return;
  e.preventDefault(); try{ h.setPointerCapture(e.pointerId); }catch(x){}
  drag={item,list,id:item.dataset.rid,moved:false,startY:e.clientY};
  item.classList.add('dragging');
});
document.addEventListener('pointermove',e=>{
  if(!drag) return; const y=e.clientY; if(Math.abs(y-drag.startY)>3) drag.moved=true;
  const items=[...drag.list.querySelectorAll('.round-item')].filter(x=>x!==drag.item);
  let before=null; for(const it of items){ const r=it.getBoundingClientRect(); if(y<r.top+r.height/2){ before=it; break; } }
  if(before){ if(drag.item.nextElementSibling!==before) drag.list.insertBefore(drag.item,before); } else if(drag.list.lastElementChild!==drag.item) drag.list.appendChild(drag.item);
  if(y<70) window.scrollBy(0,-12); else if(y>window.innerHeight-50) window.scrollBy(0,12);
});
function endDrag(){
  if(!drag) return; const d=drag; drag=null; d.item.classList.remove('dragging');
  const q=curQuiz(); if(!q) return;
  const order=[...d.list.querySelectorAll('.round-item')].map(x=>x.dataset.rid);
  const before=q.rounds.map(r=>r.id).join(',');
  if(order.join(',')!==before){ const map=Object.fromEntries(q.rounds.map(r=>[r.id,r])); q.rounds=order.map(id=>map[id]).filter(Boolean); saveQuiz(q); toast('Volgorde aangepast'); }
  render();
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  const a=el.dataset.a; if(!A[a]) return;
  if(el.tagName==='INPUT'&&el.type==='checkbox'){ A[a](el,e); return; }
  if(a!=='scrim') e.preventDefault();
  A[a](el,e);
});
document.addEventListener('submit',e=>{
  const f=e.target; e.preventDefault();
  if(f.dataset.form==='login'){ const email=String(($('#login-email')||{}).value||'').trim(); if(!email) return;
    ui_login.email=email; ui_login.busy=true; ui_login.err=''; render();
    sb.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:location.origin+location.pathname}}).then(({error})=>{
      ui_login.busy=false;
      if(error){ ui_login.err=/signups? not allowed|not found|otp_disabled/i.test(error.message)?'Dit e-mailadres heeft nog geen toegang. Vraag de beheerder om een uitnodiging.':/rate|seconds/i.test(error.message)?'Er zijn net al een paar mails verstuurd. Wacht een minuut en probeer het opnieuw.':'Versturen lukte niet: '+error.message; }
      else ui_login.sent=true; render(); });
    return; }
  if(f.dataset.form==='quickTeam'){ const q=curQuiz(); const fd=new FormData(f); const cap=String(fd.get('captain')||ui.qt.captain||'').trim();
    if(!cap){ toast('Vul de naam van de contactpersoon in','bad'); const n=$('#nt-cap'); if(n) n.focus(); return; }
    const t=addTeam(q,{captain:cap,players:num(fd.get('players'))||num(q.maxTeamSize)||4,phone:String(fd.get('phone')||'').trim(),email:String(fd.get('email')||'').trim()});
    if(!saveQuiz(q,0)){ q.teams.pop(); return; } ui.qt={captain:'',players:'',phone:'',email:''}; render(); const n=$('#nt-cap'); if(n) n.focus();
    toast(t.status==='wachtlijst'?`${cap} staat op de wachtlijst (avond is vol)`:`${cap} aangemeld, tafel ${t.table}`); }
});
function applyBind(el){
  const q=curQuiz(); const v=val(el);
  if(el.dataset.q!=null){ setPath(q,el.dataset.q,v); if(el.dataset.q==='venueId'){ const vv=S.venues[v]; if(vv) q.venue=vv.name; } saveQuiz(q); return true; }
  if(el.dataset.r!=null){ const [rid,k]=el.dataset.r.split('.'); const r=q.rounds.find(x=>x.id===rid); if(r){ r[k]=v;
      if(k==='sheetId'&&v&&S.sheets[v]){ const n=sheetItems(S.sheets[v]).length; if(n) r.qCount=n; }
      saveQuiz(q); } return true; }
  if(el.dataset.t!=null){ const [tid,k]=el.dataset.t.split('.'); const t=q.teams.find(x=>x.id===tid); if(t){ t[k]=v; saveQuiz(q); } return true; }
  if(el.dataset.ty!=null){ const [i,k]=el.dataset.ty.split('.'); S.types=clone(types()); S.types[+i][k]=k==='color'?+v:v; persist('settings/types'); return true; }
  if(el.dataset.ui!=null){ const k=el.dataset.ui; if(k==='standAfter') ui.standAfter=+v; else if(k==='hideAnswers') ui.hideAnswers=!!v; else setPath(ui,k,v); return true; }
  return false;
}
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.m!=null){ if(!ui.modal) return; if(ui.modal.draft&&el.dataset.m!=='search'&&el.dataset.m!=='text') setPath(ui.modal.draft,el.dataset.m,val(el)); else ui.modal[el.dataset.m]=val(el);
    if(el.dataset.rr) renderModal(); else if(ui.modal.kind==='sheet'&&/^items\.\d+\.a$/.test(el.dataset.m)){ const g=$('#modal-root .grow b'); if(g) g.textContent=ui.modal.draft.items.filter(it=>String(it.a||'').trim()).length; } return; }
  if(el.dataset.s!=null){ if(el.validity&&el.validity.badInput) return; const q=curQuiz(); const [tid,rid]=el.dataset.s.split('|'); q.scores=q.scores||{}; q.scores[tid]=q.scores[tid]||{}; const v=num(el.value); if(v==null) delete q.scores[tid][rid]; else q.scores[tid][rid]=v; saveQuiz(q,700);
    el.classList.toggle('over',v!=null&&(v<0||v>(+el.max||Infinity))); return; }
  if(el.dataset.qt!=null){ ui.qt[el.dataset.qt]=el.value; return; }
  if(el.dataset.lg!=null){ ui_login[el.dataset.lg]=el.value; return; }
  if(el.type==='checkbox'||el.tagName==='SELECT') return;
  if(el.dataset.ui!=null){ applyBind(el); ui.bank.limit=80; render(); return; }
  applyBind(el);
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.upload==='sheet'){ uploadSheetFile(el.files&&el.files[0]); return; }
  if(el.dataset.m!=null){ if(!ui.modal) return; if(ui.modal.draft&&el.dataset.m!=='search'&&el.dataset.m!=='text') setPath(ui.modal.draft,el.dataset.m,val(el)); else ui.modal[el.dataset.m]=val(el); if(el.dataset.rr) renderModal(); return; }
  const bound=['q','r','t','ty','ui','s'].some(k=>el.dataset[k]!=null);
  if(!bound) return;
  if(el.type==='checkbox'||el.tagName==='SELECT'){ applyBind(el); renderSafe(); return; }
  renderSafe();
});
/* Re-render pas na een klik: anders vervangt de nieuwe opmaak de knop waar je net op drukte */
let ptrDown=false,deferredRender=false;
document.addEventListener('pointerdown',()=>{ ptrDown=true; },true);
function releasePtr(){ ptrDown=false; if(deferredRender) setTimeout(()=>{ if(deferredRender){ deferredRender=false; if(editingInApp()) pendingRender=true; else render(); } },0); }
document.addEventListener('pointerup',releasePtr,true);
document.addEventListener('pointercancel',releasePtr,true);
function renderSafe(){ if(ptrDown){ deferredRender=true; return; } render(); }
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&ui.modal){ closeModal(); return; }
  const el=e.target;
  if(el.classList&&el.classList.contains('drag-h')&&(e.key==='ArrowUp'||e.key==='ArrowDown')){ e.preventDefault(); const q=curQuiz(); const id=el.dataset.rid; const i=q.rounds.findIndex(r=>r.id===id);
    if(moveRound(q,id,i+(e.key==='ArrowUp'?-1:1))){ render(); const h=document.querySelector(`.drag-h[data-rid="${id}"]`); if(h) h.focus(); } return; }
  if(e.key==='Enter'&&el.classList&&el.classList.contains('score-in')){ e.preventDefault(); const r=+el.dataset.row+(e.shiftKey?-1:1), c=+el.dataset.col;
    const nx=document.querySelector(`.score-in[data-row="${r}"][data-col="${c}"]`)||document.querySelector(`.score-in[data-row="0"][data-col="${c+1}"]`);
    if(nx){ const nid=nx.id; nx.focus(); try{ nx.select(); }catch(x){}
      setTimeout(()=>{ const n2=document.getElementById(nid); if(n2&&document.activeElement!==n2){ n2.focus(); try{ n2.select(); }catch(x){} } },0); } }
});
let toastT=null;
function toast(msg,kind){ const t=$('#toast'); t.textContent=msg; t.className=kind||''; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{t.hidden=true;},3200); }
boot();
</script>
